name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(npx --yes wrangler@4.111.0 pages secret list --project-name=mishanya-site)"
          for secret_name in BITRIX_EVENT_TOKEN BITRIX_EVENT_DOMAIN GIFT_DATA_SECRET TURNSTILE_SECRET_KEY; do
            if ! grep -Fq -- "- ${secret_name}:" <<<"${secret_list}"; then
              echo "Required Cloudflare Pages secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Verify required gift sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(npx --yes wrangler@4.111.0 secret list --config wrangler.gift-sync.toml)"
          for secret_name in BITRIX_WEBHOOK_URL GIFT_DATA_SECRET; do
            if ! grep -Fq -- "\"name\": \"${secret_name}\"" <<<"${secret_list}"; then
              echo "Required gift sync Worker secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Build
        env:
          NEXT_PUBLIC_META_PIXEL_ID: "987879420515178"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build:pages

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=mishanya-site --branch=main --commit-dirty=true

      - name: Publish gift sync Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.gift-sync.toml

      - name: Verify Bitrix webhook configuration
        run: |
          set -euo pipefail
          status="$({ curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'event=ONCRMDEALUPDATE' \
            --data-urlencode 'event_handler_id=1' \
            --data-urlencode 'data[FIELDS][ID]=1' \
            --data-urlencode 'ts=1' \
            --data-urlencode 'auth[application_token]=deployment-health-check-invalid' \
            --data-urlencode 'auth[domain]=deployment-health-check.invalid' \
            'https://mishanya-show.com/api/bitrix/deal-update'; } 2>/dev/null)"
          if [ "${status}" != "401" ]; then
            echo "Bitrix webhook configuration check failed with HTTP ${status}" >&2
            exit 1
          fi
